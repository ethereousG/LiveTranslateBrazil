<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live PT -> EN Earbud Interpreter</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; }
    button { width: 100%; padding: 18px; font-size: 1.2rem; border-radius: 8px; border: none; font-weight: bold; }
    .start { background: #00e676; color: #000; }
    .stop { background: #ff5252; color: #fff; }
    #log { margin-top: 20px; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; color: #aaa; }
  </style>
</head>
<body>
  <h2>Live Portuguese Interpreter</h2>
  <button id="toggleBtn" class="start">Start Listening</button>
  <div id="log">Status: Idle</div>

  <script>
    const API_KEY = "YOUR_GEMINI_API_KEY";
    const HOST = "generativelanguage.googleapis.com";
    const MODEL = "models/gemini-2.0-flash-exp"; // Supports Live Multimodal WebSocket
    const URI = `wss://${HOST}/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${API_KEY}`;

    let ws = null;
    let audioCtx = null;
    let micStream = null;
    let isRunning = false;
    const btn = document.getElementById("toggleBtn");
    const logEl = document.getElementById("log");

    function log(msg) { logEl.textContent = msg; }

    btn.onclick = async () => {
      if (!isRunning) {
        await startSession();
      } else {
        stopSession();
      }
    };

    async function startSession() {
      btn.disabled = true;
      log("Connecting to Gemini Live...");

      ws = new WebSocket(URI);

      ws.onopen = () => {
        log("Connected. Configuring session...");
        // 1. Initial Handshake Config
        const setupMessage = {
          setup: {
            model: MODEL,
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } }
              }
            },
            systemInstruction: {
              parts: [{
                text: "You are a live simultaneous interpreter. " +
                      "Translate all incoming Portuguese speech into English immediately. " +
                      "Output only the translated English audio. Never comment, reply, or add conversational remarks."
              }]
            }
          }
        };
        ws.send(JSON.stringify(setupMessage));
        startMicCapture();
        isRunning = true;
        btn.textContent = "Stop Interpreter";
        btn.className = "stop";
        btn.disabled = false;
        log("Listening to surrounding Portuguese...");
      };

      ws.onmessage = async (event) => {
        let data = event.data;
        if (data instanceof Blob) data = await data.text();
        const msg = JSON.parse(data);

        // 2. Play incoming 24kHz PCM audio chunks through headphones
        const parts = msg.serverContent?.modelTurn?.parts || [];
        for (const part of parts) {
          if (part.inlineData && part.inlineData.data) {
            playPcmChunk(part.inlineData.data);
          }
        }
      };

      ws.onclose = () => stopSession();
      ws.onerror = (err) => { console.error(err); stopSession(); };
    }

    async function startMicCapture() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      
      const source = audioCtx.createMediaStreamSource(micStream);
      // Process 16kHz audio slices
      const processor = audioCtx.createScriptProcessor(2048, 1, 1);
      
      processor.onaudioprocess = (e) => {
        if (!isRunning || ws.readyState !== WebSocket.OPEN) return;
        const inputData = e.inputBuffer.getChannelData(0);
        
        // Convert Float32Array to 16-bit signed PCM
        const pcm16 = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
          pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
        }

        // Base64 encode PCM and push upstream
        const base64Chunk = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
        ws.send(JSON.stringify({
          realtimeInput: {
            mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Chunk }]
          }
        }));
      };

      source.connect(processor);
      processor.connect(audioCtx.destination);
    }

    // Audio Output Playback Queue (24,000 Hz PCM)
    let playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    let scheduledTime = 0;

    function playPcmChunk(base64Data) {
      const binary = atob(base64Data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      
      const int16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

      const buffer = playCtx.createBuffer(1, float32.length, 24000);
      buffer.getChannelData(0).set(float32);

      const source = playCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(playCtx.destination);

      if (scheduledTime < playCtx.currentTime) scheduledTime = playCtx.currentTime;
      source.start(scheduledTime);
      scheduledTime += buffer.duration;
    }

    function stopSession() {
      isRunning = false;
      if (ws) ws.close();
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      btn.textContent = "Start Listening";
      btn.className = "start";
      btn.disabled = false;
      log("Status: Idle");
    }
  </script>
</body>
</html>
