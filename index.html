<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live PT -> EN Earbud Interpreter</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; text-align: center; }
    input { width: 90%; max-width: 380px; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 1rem; }
    button { width: 95%; max-width: 400px; padding: 18px; font-size: 1.2rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    .start { background: #00e676; color: #000; }
    .stop { background: #ff5252; color: #fff; }
    #log { margin-top: 20px; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; color: #bbb; text-align: left; background: #1e1e1e; padding: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>Live Portuguese Interpreter</h2>
  
  <input type="password" id="keyInput" placeholder="Paste Gemini API Key here" />
  <button id="toggleBtn" class="start">Start Listening</button>
  <div id="log">Status: Ready</div>

  <script>
    const HOST = "generativelanguage.googleapis.com";
    const MODEL = "models/gemini-2.0-flash-exp";

    let ws = null;
    let audioCtx = null;
    let playCtx = null;
    let micStream = null;
    let processor = null;
    let isRunning = false;
    let scheduledTime = 0;

    const btn = document.getElementById("toggleBtn");
    const logEl = document.getElementById("log");
    const keyInput = document.getElementById("keyInput");

    if (localStorage.getItem("gemini_key")) {
      keyInput.value = localStorage.getItem("gemini_key");
    }

    function log(msg) {
      console.log(msg);
      logEl.textContent = msg;
    }

    btn.onclick = async () => {
      if (!isRunning) {
        await startSession();
      } else {
        stopSession();
      }
    };

    async function startSession() {
      const apiKey = keyInput.value.trim();
      if (!apiKey) {
        alert("Please paste your Gemini API key first.");
        return;
      }
      localStorage.setItem("gemini_key", apiKey);

      btn.disabled = true;
      log("Requesting mic permission & connecting...");

      try {
        // Unlock Web Audio contexts on tap gesture
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        await audioCtx.resume();
        await playCtx.resume();
        scheduledTime = playCtx.currentTime;

        // Open mic stream
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        const URI = `wss://${HOST}/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${apiKey}`;
        ws = new WebSocket(URI);

        ws.onopen = () => {
          log("Connected. Starting translation session...");
          const setupMessage = {
            setup: {
              model: MODEL,
              generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: {
                  voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } }
                }
              },
              systemInstruction: {
                parts: [{
                  text: "You are a live simultaneous interpreter. " +
                        "Translate all incoming spoken Portuguese directly into English immediately. " +
                        "Output only the translated English audio. Never comment, reply, or add conversational filler."
                }]
              }
            }
          };
          ws.send(JSON.stringify(setupMessage));
          startMicCapture();
          isRunning = true;
          btn.textContent = "Stop Interpreter";
          btn.className = "stop";
          btn.disabled = false;
          log("Listening to Portuguese...");
        };

        ws.onmessage = async (event) => {
          let data = event.data;
          if (data instanceof Blob) data = await data.text();
          const msg = JSON.parse(data);

          const parts = msg.serverContent?.modelTurn?.parts || [];
          for (const part of parts) {
            if (part.inlineData && part.inlineData.data) {
              playPcmChunk(part.inlineData.data);
            }
          }
        };

        ws.onclose = (event) => {
          log(`Session disconnected (Code: ${event.code}, Reason: ${event.reason || "None given"})`);
          stopSession();
        };

        ws.onerror = (err) => {
          log("WebSocket connection encountered an error.");
          stopSession();
        };

      } catch (err) {
        log(`Error starting session: ${err.message}`);
        stopSession();
      }
    }

    function startMicCapture() {
      const source = audioCtx.createMediaStreamSource(micStream);
      processor = audioCtx.createScriptProcessor(4096, 1, 1);

      processor.onaudioprocess = (e) => {
        if (!isRunning || !ws || ws.readyState !== WebSocket.OPEN) return;
        const inputData = e.inputBuffer.getChannelData(0);

        const pcm16 = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
          pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
        }

        const base64Chunk = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
        ws.send(JSON.stringify({
          realtimeInput: {
            mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Chunk }]
          }
        }));
      };

      source.connect(processor);
      processor.connect(audioCtx.destination);
    }

    function playPcmChunk(base64Data) {
      const binary = atob(base64Data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      const int16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

      const buffer = playCtx.createBuffer(1, float32.length, 24000);
      buffer.getChannelData(0).set(float32);

      const source = playCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(playCtx.destination);

      if (scheduledTime < playCtx.currentTime) scheduledTime = playCtx.currentTime;
      source.start(scheduledTime);
      scheduledTime += buffer.duration;
    }

    function stopSession() {
      isRunning = false;
      if (processor) {
        try { processor.disconnect(); } catch (e) {}
        processor = null;
      }
      if (audioCtx) {
        try { audioCtx.close(); } catch (e) {}
        audioCtx = null;
      }
      if (playCtx) {
        try { playCtx.close(); } catch (e) {}
        playCtx = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
      }
      btn.textContent = "Start Listening";
      btn.className = "start";
      btn.disabled = false;
    }
  </script>
</body>
</html>
